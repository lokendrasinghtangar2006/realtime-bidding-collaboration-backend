<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Auction</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:#f0f6fc;min-height:100vh;display:grid;place-items:center}
.card{width:min(760px,92vw);background:#161b22;border:1px solid #30363d;border-radius:18px;padding:30px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 10px}
.status{color:#3fb950;margin-bottom:22px}
.price{font-size:48px;font-weight:800;margin:12px 0}
.muted{color:#8b949e}
.row{display:flex;gap:10px;margin-top:22px}
input,button{border-radius:10px;border:1px solid #30363d;padding:13px;font-size:16px}
input{background:#0d1117;color:white;flex:1}
button{background:#ff9f0a;color:#111;font-weight:700;cursor:pointer}
#log{margin-top:22px;background:#0d1117;padding:15px;border-radius:10px;min-height:70px;color:#8b949e}
</style>
</head>
<body>
<main class="card">
<div class="status" id="status">Connecting...</div>
<h1 id="item">Loading auction...</h1>
<div class="muted">Current highest bid</div>
<div class="price" id="price">₹0.00</div>
<div class="muted">Highest bidder: <span id="bidder">-</span></div>
<div class="row">
<input id="name" placeholder="Your name" value="Alice">
<input id="amount" type="number" step="0.01" placeholder="Bid amount">
<button onclick="placeBid()">PLACE BID</button>
</div>
<div id="log">Waiting for real-time updates...</div>
</main>
<script>
let socket;

function connect(){
  const protocol=location.protocol==="https:"?"wss":"ws";
  socket=new WebSocket(`${protocol}://${location.host}/ws`);

  socket.onopen=()=>{
    document.getElementById("status").textContent="● Connected";
    log("Connected to live auction.");
  };

  socket.onclose=()=>{
    document.getElementById("status").textContent="● Disconnected. Reconnecting...";
    setTimeout(connect,1000);
  };

  socket.onmessage=(event)=>{
    const data=JSON.parse(event.data);

    if(data.type==="state"){
      render(data.auction);
      if(data.event==="bid_accepted"){
        log("New highest bid by "+data.auction.highest_bidder);
      }
    }

    if(data.type==="bid_result") log(data.message);
    if(data.type==="error") log("Error: "+data.message);
  };
}

function render(a){
  document.getElementById("item").textContent=a.item_name;
  document.getElementById("price").textContent=
    "₹"+Number(a.highest_bid).toLocaleString("en-IN",{minimumFractionDigits:2});
  document.getElementById("bidder").textContent=a.highest_bidder;
}

function placeBid(){
  if(!socket || socket.readyState!==WebSocket.OPEN){
    log("Not connected."); return;
  }
  socket.send(JSON.stringify({
    type:"place_bid",
    bidder:document.getElementById("name").value.trim(),
    amount:Number(document.getElementById("amount").value)
  }));
}

function log(message){
  document.getElementById("log").textContent=message;
}

connect();
</script>
</body>
</html>
